plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.laundryking.scanner'
    compileSdk 34

    defaultConfig {
        applicationId "com.laundryking.scanner"
        minSdk 22
        targetSdk 34
        versionCode 4
        versionName "0.4.0"
        // The Chainway C72 is ARM; ship only ABIs the .aar provides native libs for.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'armeabi'
        }
    }

    buildTypes {
        debug {
            // Point the app at the live backend by default; overridable in-app.
            buildConfigField "String", "DEFAULT_BASE_URL", "\"https://laundryking.senses-iot.com/v1\""
            buildConfigField "String", "DEFAULT_BRANCH_ID", "\"branch-1\""
        }
        release {
            minifyEnabled false
            buildConfigField "String", "DEFAULT_BASE_URL", "\"https://laundryking.senses-iot.com/v1\""
            buildConfigField "String", "DEFAULT_BRANCH_ID", "\"branch-1\""
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    // The Chainway .aar ships prebuilt .so files; don't let AGP strip/repack them oddly.
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    // Chainway UHF RFID SDK (com.rscja.deviceapi) — local .aar with native libs.
    implementation files('libs/DeviceAPI.aar')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
